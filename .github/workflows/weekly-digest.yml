name: Weekly digest

# Runs the whole pipeline once a week: fetch the last 7 days of arXiv ML papers, classify /
# parse / categorize / summarize, store them in Supabase, and email the digest to subscribers.
# `arxiv-digest ingest` does all of that in one command (the email is the pipeline's last step).
on:
  schedule:
    - cron: "3 3 * * 1" # Mondays 03:03 UTC (00:03 UTC-03). Just past Sunday->Monday midnight Uruguay, so the run still finishes before 07:00 UTC-03 even when GitHub's scheduler lags by hours; off the top of the hour to dodge contention.
    - cron: "3 7 * * 1"
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Skip if a digest already succeeded today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%Y-%m-%d)
          count=$(gh run list --workflow weekly-digest.yml --status success --created "$today" --json databaseId --jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install the Claude CLI
        # The claude_code backend shells out to the `claude` CLI, authenticated by the OAuth
        # token below (a Claude subscription — no API key). Native installer, no Node needed.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the weekly pipeline (ingest + email)
        env:
          # Run on the Claude subscription via the CLI's OAuth token (generate with
          # `claude setup-token`). To use a pay-per-token API instead, set LLM_BACKEND=litellm
          # and LLM_API_KEY (and drop CLAUDE_CODE_OAUTH_TOKEN); see config.toml for model strings.
          LLM_BACKEND: claude_code
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMA_CLOUD_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Project URL (https://<ref>.supabase.co) — builds the unsubscribe link in each digest.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: uv run arxiv-digest ingest
