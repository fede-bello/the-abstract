# Non-sensitive configuration for the-abstract.
#
# Edit values here to tune the pipeline. Secrets (API keys) do NOT belong here — put
# those in .env. Any value below can also be overridden by an environment variable of
# the same name (e.g. MAX_RESULTS=5), which takes precedence over this file.

# --- Ingestion ---
# arXiv categories to ingest (must be non-empty).
arxiv_categories = [
    "cs.LG",    # Machine Learning
    "cs.CL",    # Computation and Language
    "cs.CV",    # Computer Vision and Pattern Recognition
    "cs.AI",    # Artificial Intelligence
    "cs.NE",    # Neural and Evolutionary Computing
    "stat.ML",  # Statistics / Machine Learning
    "math.OC",  # Optimization and Control
    "math.ST",  # Statistics Theory
]
max_results = 25   # Max papers per ingestion run.
days_back = 7      # Only fetch papers submitted in the last N days.

# --- arXiv client + retry/backoff (seconds) ---
arxiv_page_size = 100
arxiv_request_delay_seconds = 5.0
arxiv_num_retries = 1
arxiv_max_attempts = 6
arxiv_retry_base_delay_seconds = 3.0
arxiv_retry_max_delay_seconds = 60.0
arxiv_pdf_download_timeout_seconds = 60.0

# --- LLM / classification ---
# llm_backend: "auto" prefers the Claude Code SDK (subscription), falls back to
# LiteLLM. Other options: "claude_code", "litellm".
llm_backend = "auto"
classification_model = "claude-haiku-4-5-20251001"
summarization_model = "claude-sonnet-4-6"
summarization_max_output_tokens = 2048
llm_timeout_seconds = 60.0
llm_max_concurrency = 4

# --- Parsing (LlamaParse v2) ---
# parse_tier, cheapest -> most accurate: "fast", "cost_effective", "agentic", "agentic_plus".
parse_tier = "cost_effective"
parse_max_concurrency = 4
parse_timeout_seconds = 1800.0

# Estimated USD per parsed page, per tier — used only for the weekly cost report
# (`arxiv-digest usage`). LlamaParse pricing is plan-specific, so these are EDITABLE ESTIMATES:
# replace them with your LlamaCloud plan's actual per-page rates for an accurate $ figure.
parse_cost_per_page_usd = { fast = 0.001, cost_effective = 0.003, agentic = 0.006, agentic_plus = 0.009 }

# --- Workflow / runtime ---
workflow_timeout_seconds = 86400   # Max seconds per run.
log_level = "INFO"                 # DEBUG | INFO | WARNING | ERROR | CRITICAL

# --- Embeddings (local HuggingFace model for RAG) ---
# embedding_dim MUST match the model and the vector(N) column in the DB migration.
embedding_model = "BAAI/bge-small-en-v1.5"
embedding_dim = 384
embedding_device = "cpu"   # "cpu", "cuda", or "mps" (Apple Silicon)
chunk_size = 512           # tokens per chunk
chunk_overlap = 64         # token overlap between chunks

# --- Email digest (SMTP) ---
# Defaults target Gmail (use a Gmail App Password as SMTP_PASSWORD). Point host/port at any
# provider (Resend/Mailgun/SES SMTP, ...) to switch — no code change. Credentials live in .env.
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_starttls = true
email_from = ""   # "arXiv ML Digest <you@gmail.com>"; blank falls back to SMTP_USERNAME
weekly_insight_max_output_tokens = 512   # Tokens for the one-paragraph weekly insight.
# Supabase project URL — builds the digest's unsubscribe link (-> the `unsubscribe` Edge
# Function). Per-deployment; set it here or via the SUPABASE_URL env var. Blank = no link.
supabase_url = ""

# --- Storage ---
data_dir = "data"   # Root directory for downloaded files.
