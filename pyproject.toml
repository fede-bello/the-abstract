[project]
name = "arxiv-digest"
version = "0.1.0"
description = "Weekly, AI-curated email digests of new machine-learning papers from arXiv."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Federico Bello" }]
dependencies = [
    # Orchestration — the pipeline is built on LlamaIndex Workflows
    "llama-index-workflows>=2.0",
    "llama-index-core>=0.12",
    # LLM + document parsing
    "llama-index-llms-anthropic>=0.6",
    # LlamaParse v2 — PDF → markdown via the cost-effective tier (the v2 `llama-cloud`
    # SDK; the classic `llama-cloud-services` pins llama-cloud<0.2 and can't coexist).
    "llama-cloud>=2.1",
    # Storage / vector search (Supabase Postgres + pgvector) — hand-rolled async SQL
    "asyncpg>=0.30",
    "pgvector>=0.4",
    # Local embeddings for RAG: BAAI/bge-small-en-v1.5 (384-dim) via HuggingFace (pulls torch)
    "llama-index-embeddings-huggingface>=0.3",
    # Email digest delivery (async SMTP)
    "aiosmtplib>=3.0",
    # Core
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # arXiv API client — metadata query (PDF download is done via httpx, see clients/arxiv.py).
    # Pinned to the tested 4.x major; 4.0 dropped Result.download_pdf and changed author.affiliation.
    "arxiv>=4,<5",
    # LLM backends: Claude Code SDK (subscription) primary, LiteLLM (provider-swap) fallback
    "claude-agent-sdk>=0.1",
    "litellm>=1.50",
]

[project.urls]
Homepage = "https://the-abstract.vercel.app"
Repository = "https://github.com/fede-bello/the-abstract"

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/arxiv_digest"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src"]
extend-exclude = [".venv", "frontend"]

[tool.ruff.lint]
select = ["ALL"]
extend-ignore = [
    # Docstrings
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D106", # Missing docstring in public nested class
    "D107", # Document __init__ in the class body, not the method

    # TODOs / FIXMEs
    "FIX",   # Allow FIXME comments
    "TD002", # Allow TODO without author
    "TD003", # Allow TODO without issue link

    # Misc
    "CPY", # No copyright-notice requirement

    # Allow lazy/optional imports of heavy backends inside functions (litellm, SDK).
    "PLC0415",

    # Conflicts with the ruff formatter — keep disabled when formatting with ruff
    "W191", "E111", "E114", "E117",
    "D206", "D300",
    "Q000", "Q001", "Q002", "Q003",
    "COM812", "COM819",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert, skip docstrings/annotations, use literal values freely, and
# leave args unused in fakes that mirror a real signature.
"backend/tests/**" = ["S101", "S106", "D", "ANN", "PLR2004", "INP001", "ARG"]
# The CLI writes to stdout by design.
"backend/src/arxiv_digest/cli.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# Pydantic models and workflow events evaluate their annotations at runtime,
# so their imports must stay at runtime (not moved into a TYPE_CHECKING block).
runtime-evaluated-base-classes = ["pydantic.BaseModel", "workflows.events.Event"]

[tool.mypy]
python_version = "3.11"
files = ["backend/src"]
exclude = ["^backend/tests/"]
strict = true
plugins = ["pydantic.mypy"]

# Several LlamaIndex / LlamaCloud packages don't ship type stubs yet.
[[tool.mypy.overrides]]
module = [
    "llama_index.*",
    "workflows.*",
    "arxiv",
    "arxiv.*",
    "litellm",
    "litellm.*",
    "claude_agent_sdk",
    "claude_agent_sdk.*",
    "asyncpg",
    "asyncpg.*",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["backend/src", "backend/tests"]
testpaths = ["backend/tests"]
# importlib mode lets the mirrored layout reuse basenames (steps/*/test_step.py).
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "integration: tests that call a real external backend (LLM, database, or embedding model)",
]
